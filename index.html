<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090B0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Code Assistants" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Code Assistants & Projetos</title>
    <meta name="description" content="Assistentes de código via múltiplas APIs: execução de projetos, arquivos locais, tarefas, checkpoints e transferência automática entre IAs." />
    <meta property="og:title" content="Code Assistants" />
    <meta property="og:description" content="Crie projetos com assistentes de código, preserve arquivos e transfira automaticamente o trabalho para a próxima IA disponível." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        // Desregistra service workers antigos que podem interceptar requisições
        // e causar erro 404 ou impedir o app de se reconhecer como Windows.
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        // Se rodando pelo EXE (localhost), identifica como Windows para ativar
        // barra lateral, atualização automática e login no GitHub.
        if (typeof window !== 'undefined' &&
          (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') &&
          !window.CodeAssistantsDesktop) {
          var isAndroid = /android/i.test(navigator.userAgent);
          window.CodeAssistantsDesktop = { version: '', platform: isAndroid ? 'android' : 'windows' };
        }
      })();
    </script>
  </head>
  <body class="bg-[#090B0E] text-zinc-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
