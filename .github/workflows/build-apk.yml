name: Build and publish APK and EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão sem o "v" (ex.: 3.2.1) — precisa casar com android:versionName'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -1)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          # O motor nativo usa o aapt clássico (build-tools 34). Se por algum motivo
          # ele não vier no pacote, pega de uma build-tools antiga que sempre o traz.
          if [ ! -f "$SDK/build-tools/34.0.0/aapt" ]; then
            "$SDKMANAGER" "build-tools;30.0.3"
            cp "$SDK/build-tools/30.0.3/aapt" "$SDK/build-tools/34.0.0/aapt"
            chmod +x "$SDK/build-tools/34.0.0/aapt"
          fi
          "$SDK/build-tools/34.0.0/aapt" version

      - name: Conferir versão
        run: |
          MANIFEST_VERSION="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' src/server/android-native/AndroidManifest.xml)"
          echo "manifest=$MANIFEST_VERSION input=${{ inputs.version }}"
          test "$MANIFEST_VERSION" = "${{ inputs.version }}"

      - name: Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test || bun test

      - name: Build APK
        run: bun scripts/build-apk.ts

      - name: Source ZIP
        run: git archive --format=zip -o "build/Code-Assistants-v${{ inputs.version }}-source.zip" HEAD

      - name: Check assets
        run: |
          test -f "build/Code-Assistants-v${{ inputs.version }}.apk"
          test -f "build/Code-Assistants-v${{ inputs.version }}-source.zip"
          ls -l build

      - name: Upload APK assets
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          if-no-files-found: error
          path: |
            build/Code-Assistants-v${{ inputs.version }}.apk
            build/Code-Assistants-v${{ inputs.version }}-source.zip

  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Dependencies
        run: bun install --frozen-lockfile

      # Compila a interface sem service worker e empacota tudo em um .exe (bun compile).
      - name: Build Windows EXE
        run: bun scripts/build-exe.ts

      - name: Check asset
        run: |
          test -f "build/Code-Assistants-v${{ inputs.version }}.exe"
          ls -l build

      - name: Upload EXE asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          if-no-files-found: error
          path: build/Code-Assistants-v${{ inputs.version }}.exe

  installer:
    runs-on: ubuntu-latest
    needs: [exe]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar NSIS
        run: sudo apt-get update -y && sudo apt-get install -y nsis

      - name: Baixar EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: build

      - name: Compilar instalador do Windows
        run: |
          cp "build/Code-Assistants-v${{ inputs.version }}.exe" "installer/"
          makensis -DAPP_VERSION="${{ inputs.version }}" \
            -DAPP_EXE="installer/Code-Assistants-v${{ inputs.version }}.exe" \
            -DOUTFILE="build/Code-Assistants-v${{ inputs.version }}-setup.exe" \
            installer/installer.nsi
          test -f "build/Code-Assistants-v${{ inputs.version }}-setup.exe"
          ls -l build

      - name: Upload instalador
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          if-no-files-found: error
          path: build/Code-Assistants-v${{ inputs.version }}-setup.exe

  # GitHub não aceita adicionar arquivos a um release já publicado (releases
  # imutáveis), então os três arquivos sobem juntos, de uma só vez.
  release:
    needs: [apk, exe, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          path: build
          merge-multiple: true

      - name: Check release files
        run: |
          test -f "build/Code-Assistants-v${{ inputs.version }}.apk"
          test -f "build/Code-Assistants-v${{ inputs.version }}.exe"
          test -f "build/Code-Assistants-v${{ inputs.version }}-setup.exe"
          test -f "build/Code-Assistants-v${{ inputs.version }}-source.zip"
          test -f "release-notes/v${{ inputs.version }}.md"
          ls -l build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Code Assistants v${{ inputs.version }}
          body_path: release-notes/v${{ inputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            build/Code-Assistants-v${{ inputs.version }}.apk
            build/Code-Assistants-v${{ inputs.version }}.exe
            build/Code-Assistants-v${{ inputs.version }}-setup.exe
            build/Code-Assistants-v${{ inputs.version }}-source.zip
