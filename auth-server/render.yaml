services:
  - type: web
    name: code-assistants-auth
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@codeassistants.local
      - key: ADMIN_PASSWORD
        generateValue: true
